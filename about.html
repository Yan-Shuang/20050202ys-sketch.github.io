        <div class="personal-section-title"><span>01</span><h2>关于我</h2></div>
        <div class="about-content"><div class="about-lead"><h3>我关心的不是模型能做什么，<br />而是人为什么愿意使用它。</h3></div><div class="about-text"><p>我习惯从人的行为与真实使用场景中发现问题；IP 内容运营经历，让我熟悉从选题、脚本到发布和反馈的完整链路。现在，我把这些经验带进 AI 产品实践，关注生成内容是否准确、自然、可执行，也关注用户是否真的愿意把它用起来。</p><div class="about-points"><div><b>需求</b><span>从用户场景中拆解问题，梳理目标、流程与优先级。</span></div><div><b>方法</b><span>用提示词、评测集、反例和人机协同让结果变得可验证。</span></div><div><b>表达</b><span>用产品文档、交互流程和视觉表达把想法讲清楚。</span></div></div></div></div>
